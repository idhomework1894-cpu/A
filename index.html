<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الدروس</title>
<meta name="theme-color" content="#0b1417">
<meta name="description" content="متابعة المحاضرات الأسبوعية للمواد الدراسية">

<style>
:root{--bg:#f1f5f6;--card:#fff;--ink:#12303a;--mute:#5f7a83;--line:#d6e1e4;--accent:#0e5a6b;--on:#fff;--ok:#1f8a5b;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1417;--card:#14232a;--ink:#e6f0f2;--mute:#8fa8b0;--line:#25393f;--accent:#4fc1d6;--on:#06222a;--ok:#4cc790}}
:root[data-theme="dark"]{--bg:#0b1417;--card:#14232a;--ink:#e6f0f2;--mute:#8fa8b0;--line:#25393f;--accent:#4fc1d6;--on:#06222a;--ok:#4cc790}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:24px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.day{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px}
.day.sel{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}
.day.today:not(.sel){border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.num{flex:none;width:68px;height:78px;border-radius:6px 6px 6px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800}
.num b{font-size:30px;line-height:1}.num small{font-size:11px;font-weight:500;opacity:.9}
.info{flex:1;min-width:0}
.name{font-weight:800;font-size:18px}
.meta{color:var(--mute);font-size:13px;margin:2px 0 8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;border-radius:3px}
.row{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.go{flex:1;background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:10px;font-weight:700}
.go:disabled{opacity:.5}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.tg{display:block;text-align:center;color:var(--accent);font-weight:700;padding:10px;text-decoration:none;border:1px dashed var(--accent);border-radius:12px;margin-top:4px}
.open{display:block;margin-bottom:8px;color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--accent);border-radius:10px;padding:8px 10px}
textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%;min-height:90px;direction:ltr;text-align:left}
.gap{height:14px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.sum b{font-size:28px;font-weight:800}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.hd{display:flex;justify-content:space-between;align-items:baseline}.fin{color:var(--mute);font-size:13px;margin:2px 0 10px}
.lock{text-align:center;padding-top:40px}.lock input{width:160px;font-size:24px;letter-spacing:8px}.lock input.wide{letter-spacing:0;font-size:16px;width:100%}
input[type=password],input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}input.wide{width:100%}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.hold::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:right;transition:none;pointer-events:none}.hold.ghost::after{background:rgba(127,127,127,.3)}.hold.on::after{transform:scaleX(1);transition:transform 1.5s linear}
.lr{padding:10px 0;border-top:1px solid var(--line);margin-top:8px}.li{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ln{flex:none;width:32px;height:32px;border-radius:8px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}.lt{flex:1;font-size:15px}.lt a{color:var(--ink);text-decoration:none;font-weight:700}.lr .hold{width:100%}
.late{background:#b3261e;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}.okb{color:var(--ok);font-weight:800;font-size:13px;white-space:nowrap}.wk{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-size:13px;color:var(--mute);margin-bottom:6px}.fd .ln,.fd .lt{opacity:.55}
.err{color:#d33;font-size:14px;margin-top:8px}.danger{background:#b3261e;color:#fff;border:0;border-radius:10px;padding:10px;width:100%;font-weight:700}
.ls{margin-top:10px}.ls summary{color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}.lsb{max-height:260px;overflow-y:auto;margin-top:6px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--mute)}
input[type=number],input[type=url]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;width:72px;text-align:center}
input[type=url]{width:100%;direction:ltr;text-align:left}
.set h2{font-size:16px;margin:18px 0 8px}
.line{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font-size:14px}
.chip.on{color:#fff;border-color:transparent}
.dn{font-weight:700;font-size:14px;margin-bottom:4px}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px;font-size:14px;border-radius:10px}
nav button.on{color:var(--accent);font-weight:800}
</style>
</head>

function sync(s){var T=tot(s),o=s.ok||[],c=0,f=-1,k,n=[];for(k=0;k<T;k++){n[k]=o[k]?1:0;if(n[k])c++;else if(f<0)f=k}s.ok=n;s.cnt=c;s.done=f<0?T:f}

 function backupSchedule(value,count){
  if(!value||typeof value!=='object')throw new Error('جدول الأيام غير صالح');
  var out={};
  for(var d=0;d<=6;d++){
   var row=value[d]||[];
   if(!Array.isArray(row))throw new Error('أحد أيام الجدول غير صالح');
   out[d]=[];
   row.forEach(function(index){index=Number(index);if(!Number.isInteger(index)||index<0||index>=count)throw new Error('يوجد رقم مادة غير صالح في الجدول');if(out[d].indexOf(index)<0)out[d].push(index)});
  }

 }

 function validateBackup(text){

   var links=Array.isArray(x.links)?x.links:[],limit=Array.isArray(x.ok)?x.ok:[],dates=Array.isArray(x.dt)?x.dt:[];
   if(links.length>10000)throw new Error('عدد روابط المحاضرات كبير جداً');
   var cleanLinks=links.map(function(link){

   });

   var name=String(x.n||NAMES[i]||('مادة '+(i+1))).replace(/[<>"&]/g,'').trim().slice(0,80);
   var color=/^#[0-9a-f]{3,8}$/i.test(String(x.c||''))?x.c:(COLORS[i]||PAL[i%PAL.length]);
   x.n=name||NAMES[i]||('مادة '+(i+1));x.c=color;x.total=total;x.links=cleanLinks;x.pl=backupUrl(x.pl||'',true);x.ok=ok;x.dt=dt;
   x.done=ok.reduce(function(sum,v){return sum+(v?1:0)},0);x.cnt=x.done;x.last=backupDate(x.last);x.from=backupDate(x.from)||'2026-10-07';

  }else next.hist=[];
